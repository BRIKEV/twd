name: Publish

on:
  release:
    types: [published]

# id-token: write is what makes this job publishable at all. npm Trusted
# Publishing authenticates it with a short-lived GitHub OIDC token instead of a
# long-lived NPM_TOKEN, and the same token signs provenance. Without this
# permission there is no credential to present, so the publish fails rather than
# quietly shipping an unsigned package.
#
# The trust is configured on npm against this repository AND this workflow
# filename, so renaming this file revokes it. Because `release` events run the
# default branch's copy of a workflow, a change here only takes effect once it
# is on main — never on the branch that needs it.
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org/
          cache: npm

      # node:24 ships npm 11.13.0 and `npm stage publish` needs 11.15.0 or
      # newer. Do not remove this step.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify type declarations are not empty
        run: |
          for f in dist/index.d.ts dist/runner.d.ts dist/bundled.d.ts dist/vite-plugin.d.ts dist/runner-ci.d.ts dist/ui.d.ts; do
            if [ ! -f "$f" ]; then
              echo "FAIL: $f does not exist"
              exit 1
            fi
            if [ "$(cat "$f" | grep -cv '^export {}')" -eq 0 ]; then
              echo "FAIL: $f has no real exports (empty type declarations)"
              exit 1
            fi
            echo "OK: $f"
          done

      # No NODE_AUTH_TOKEN: the trusted publisher on npm authenticates this job
      # over OIDC, so the NPM_TOKEN secret can be deleted from the repository
      # once this has shipped one release.
      #
      # `stage publish` does NOT make the version live. It uploads the tarball
      # and defers proof-of-presence, so a green run here means "staged" —
      # finish it in npm's UI, or with `npm stage approve <stage-id>`
      # (`npm stage list` to find it, `npm stage reject <stage-id>` to discard).
      # That deferral is the point: the credential CI holds can stage a release
      # but cannot complete one on its own.
      #
      # Prereleases keep going to the "beta" dist-tag so `npm install twd-js`
      # still resolves to the stable version.
      - name: Stage the publish
        run: |
          if [ "${{ github.event.release.prerelease }}" = "true" ]; then
            npm stage publish --access public --tag beta --provenance
          else
            npm stage publish --access public --provenance
          fi
