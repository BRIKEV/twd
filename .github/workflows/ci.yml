# This workflow will run tests using node and then publish a package to GitHub Packages when a release is created
# For more information see: https://help.github.com/actions/language-and-framework-guides/publishing-nodejs-packages

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write # Required for OIDC

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test:ci

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

      - name: Check for focused tests
        run: npm run check:only

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Verify type declarations are not empty
        run: |
          for f in dist/index.d.ts dist/runner.d.ts dist/bundled.d.ts dist/vite-plugin.d.ts dist/runner-ci.d.ts dist/ui.d.ts; do
            if [ ! -f "$f" ]; then
              echo "FAIL: $f does not exist"
              exit 1
            fi
            if [ "$(cat "$f" | grep -cv '^export {}')" -eq 0 ]; then
              echo "FAIL: $f has no real exports (empty type declarations)"
              exit 1
            fi
            echo "OK: $f"
          done

      - name: Pack tarball
        run: |
          mkdir packed
          npm pack --pack-destination packed

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: twd-js-tarball
          path: packed/*.tgz

  # The test matrix covers the dev toolchain (Vitest, jsdom), which needs Node 22+.
  # Consumers only run the CLI and the Vite plugin in Node, so this job installs
  # the packed tarball on the oldest Node in package.json "engines" and checks those.
  node-compat:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        node-version: [20.x]
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Download tarball
        uses: actions/download-artifact@v4
        with:
          name: twd-js-tarball
          path: packed

      - name: Install tarball in an empty project
        run: |
          mkdir consumer && cd consumer
          npm init -y > /dev/null
          npm install ../packed/*.tgz --ignore-scripts --no-audit --no-fund

      - name: Run the CLI
        working-directory: consumer
        run: |
          npx twd-js init public
          test -f public/mock-sw.js

      - name: Import the Vite plugin
        working-directory: consumer
        run: |
          node --input-type=module -e "
            import { twd, twdHmr, removeMockServiceWorker } from 'twd-js/vite-plugin';
            for (const fn of [twd, twdHmr, removeMockServiceWorker]) {
              if (typeof fn !== 'function') throw new Error('vite-plugin export is not a function');
            }
            console.log('vite-plugin OK on', process.version);
          "

  coverage:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test:ci

      - name: Upload coverage to Qlty
        uses: qltysh/qlty-action/coverage@v2
        with:
          oidc: true
          files: coverage/lcov.info
